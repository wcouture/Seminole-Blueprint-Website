<section class="about_section layout_padding-bottom layout_padding2-top">
    <div class="container">
      <div class="row">
        <div class="col-lg-5 col-md-6">
          <div class="detail-box">
            <h2>
              Custom Signs
            </h2>
          </div>
          <br>
          <form id="sign-form" enctype="multipart/form-data">
            <div class="contact_section">
              <input type="text" id="name" name="name" placeholder="Name" />
            </div>
            <div class="contact_section">
              <input type="text" id="number" name="number" placeholder="Phone Number" />
            </div>
            <div class="contact_section">
              <input type="email" id="email" name="email" placeholder="Email" />
            </div>
            <div class="contact_section">
              <h4>Format:</h4>
              <select id="size-select">
                <option disabled="true" value="">------ Yard Signs ------</option>
                <option value="18x24ss">18 x 24 single-side yard sign</option>
                <option value="18x24ds">18 x 24 double-side yard sign</option>
                <option disabled="true" value="">------ Permit Signs ------</option>
                <option value="22x28p">22 x 28 permit sign</option>
                <option value="24x36p">24 x 36 permit sign</option>
                <option value="24x36m">24 x 36 metal frame</option>
                <option disabled="true" value="">------ Custom Banner ------</option>
                <option value="banner">custom sized banner</option>
              </select>  
            </div>
            <div>
              <br>
              <h4>Design upload:</h4>
              <input type="file" name="design" accept=".pdf,.jpg,.jpeg,.png,.svg,.webp,.psd" id="design-upload"/>
            </div>
            <div class="contact_section d-flex">
              <button>
                SEND
              </button>
            </div>
          </form>
          <p hidden="true" class="banner-info" id="banner-info">Banner sizes are highly dependent on the design and specific use cases for the banners. Sizes for banner orders will be discussed in further communications.</p>
        </div>
        <div class="col-lg-7 col-md-6">
          <div class="img-box">
            <img src="images/signs.jpg" class="hover-img" alt="">
          </div>
        </div>
      </div>
    </div>
    <script src="js/form-handler.js"></script>
  </section>
