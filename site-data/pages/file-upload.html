<section class="contact_section layout_padding">
    <div class="title-bar">File Upload</div>

    <div class="centered-region" id="center">
        <form id="plan-form" class="plan-form">
            <label>Name *</label>
            <input type="text" id="f_name" placeholder="John Smith" reqiured>

            <label>Email *</label>
            <input type="email" id="f_email" placeholder="user@mail.com" reqiured>
            
            <label>Description</label>
	        <textarea wrap="soft" id="f_description" class="message-box"></textarea>
	        
            <a href="#" id="add-file">
                <div class="add-file-input">Add File</div>
            </a>
            
            <div id="file-inputs">
            </div>
            <button>Upload</button>
        </form>
    </div>

    <script>
	    let working = false;
        let plan_form = document.getElementById("plan-form");
        let add_file = document.getElementById("add-file");
        let file_inputs = document.getElementById("file-inputs");
        let f_inputs = [];

        add_file.addEventListener("click", (e) => {
            e.preventDefault();

            let input_container = document.createElement("div");
            input_container.style = "display: flex; justify-content: space-between;"

            let input = document.createElement("input");
            input.type = "file";
            input.name = `file${f_inputs.length}`;
            input.required = true;

            let input_delete = document.createElement("button")
            input_delete.innerText = "delete"
            input_delete.style = "margin: auto 0; max-height: 3em;"
            input_delete.onclick = () => {
                var index = f_inputs.indexOf(input)
                if (index >= 0)
                    f_inputs.splice(index, 1)
                file_inputs.removeChild(input_container);
            }

            input_container.appendChild(input);
            input_container.appendChild(input_delete);

            file_inputs.appendChild(input_container);

            f_inputs.push(input);
        })

        function display_success() {
            let center = document.getElementById("center");
            center.className = "centered-region fade-out-quick";

            setTimeout( () => {
                center.innerHTML = "<p>File Uploaded.</p>"
                center.className = "centered-region fade-in-quick"; 
            }, 500)
        }


        plan_form.addEventListener("submit", (e) => {
            e.preventDefault();
            if (e.target.id == "add-file") {
                return;
            }
            
            let email = document.getElementById("f_email").value;
            let name = document.getElementById("f_name").value;
	        let description = document.getElementById("f_description").value;
            
            let files = []
            for (let i = 0; i < f_inputs.length; i++) {
                if (f_inputs[i] != null && f_inputs[i].files.length > 0) {
                    files.push(f_inputs[i].files[0]);
                }
            }

            send_files(files, name, email, description)
        })

        function send_files(files, name, email, description) {
            let config = {
                method: "POST",
                mode: "same-origin",
                headers: {}
            };

            let data = new FormData();
            data.append("files", files);
            data.append("name", name);
            data.append("email", email);
            data.append("desc", description);

            console.log(JSON.stringify(data))
            
            config.body = data;
            
            fetch("/file-upload", config)
            .then((response) => response.json())
            .then((res) => {
                if (res.status == 'success'){
                    display_success()
                }
            })
        }
        
    </script>
</section>
