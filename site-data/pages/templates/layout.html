  <!-- bootstrap core css -->

<body>
  <div class="hero_area">
    <!-- header section strats -->
    <header class="header_section">
      <div class="header_top">
        <div class="container-fluid">
          <div class="contact_nav">
            <a href="tel:018506712714">
              <i class="fa fa-phone" aria-hidden="true"></i>

                Call : +01 (850) 671-2714

            </a>
            <a href="mailto:eaststore@semblueinc.com">

          </div>
        </div>
      </div>

              <span>
                Seminole Blueprint

            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav ">
                <li class="nav-item {%if page_name == 'index' %} active {%endif%}">
                  <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item {%if page_name == 'service' %} active {%endif%}">
                  <a class="nav-link" href="/services">Services</a>
                </li>
                <li class="nav-item {%if page_name == 'contact' %} active {%endif%}">
                  <a class="nav-link" href="/contact">Contact Us</a>
                </li>
                <li class="nav-item {%if page_name == 'forms' %} active {%endif%}">
                    <a class="nav-link" href="/tax-forms">Forms</a>
                </li>
              </ul>
            </div>
          </nav>
        </div>
      </div>
    </header>
    <!-- end header section -->
    {{{page}}}
