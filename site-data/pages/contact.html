  <!-- contact section -->
  <section class="contact_section layout_padding">
    <div class="container">
      <div class="heading_container">
        <h2>
          Contact Us
        </h2>
        <p>
          Contact SemBlueInc today to discover how our services can benefit your projects. We look forward to discussing your needs and providing tailored solutions that exceed expectations.
        </p>
      </div>
      <div class="row">
        <div class="col-md-6" id="form-column">
          <form name="contact" id="contact-form" action="">
            <div>
              <input type="text" id="name" name="name" placeholder="Name" />
            </div>
            <div>
              <input type="text" id="number" name="number" placeholder="Phone Number" />
            </div>
            <div>
              <input type="email" id="email" name="email" placeholder="Email" />
            </div>
            <div>
              <input type="text" id="message" name="message" class="message-box" placeholder="Message" />
            </div>
            <div class="d-flex">
              <button>
                SEND
              </button>
            </div>
          </form>
          <script src="js/form-handler.js"></script>
        </div>
        <div class="col-md-6">
          <script>
            function on_hover(element) {
              element.setAttribute('src', '../images/location-zoomed.png')
            }

            function on_out(element) {
              element.setAttribute('src', '../images/location.png')
            }

          </script>
          <a href="https://maps.app.goo.gl/bhVnHiiYKRf5tpSM8">
            <img src="../images/location.png" class="map-img" title="Click to open maps" onmouseover="on_hover(this)" onmouseout="on_out(this)">
            </img>
          </a>
          <p style="font-size: 8pt; color: #999;">(click to open in google maps)</p>
        </div>
      </div>
    </div>
  </section>

  <!-- end contact section -->
