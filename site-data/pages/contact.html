  <!-- contact section -->
  <section class="contact_section layout_padding">
    <div class="container">
      <div class="heading_container">
        <h2>
          Contact Us
        </h2>
      </div>
      <div class="row">
        <div class="col-md-6" id="contact-column">
          <form name="contact" id="contact-form" action="">
            <div>
              <input type="text" id="name" name="name" placeholder="Name" />
            </div>
            <div>
              <input type="text" id="number" name="number" placeholder="Phone Number" />
            </div>
            <div>
              <input type="email" id="email" name="email" placeholder="Email" />
            </div>
            <div>
              <input type="text" id="message" name="message" class="message-box" placeholder="Message" />
            </div>
            <div class="d-flex">

            </div>
